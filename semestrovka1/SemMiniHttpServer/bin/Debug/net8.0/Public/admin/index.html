<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Управление турами</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar__logo">
            <span class="sidebar__logo-icon">&#9992;</span>
            <span class="sidebar__logo-text">TourAdmin</span>
        </div>
        <nav class="sidebar__nav">
            <a href="/admin" class="sidebar__link sidebar__link--active">
                <span class="sidebar__link-icon">&#128203;</span>
                Туры
            </a>
            <a href="/" class="sidebar__link" target="_blank">
                <span class="sidebar__link-icon">&#127760;</span>
                Открыть сайт
            </a>
        </nav>
    </aside>

    <main class="main">
        <header class="main__header">
            <h1 class="main__title">Управление турами</h1>
            <a href="/admin/create" class="btn btn--primary">+ Добавить тур</a>
        </header>

        <div class="table-wrapper">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Страна</th>
                        <th>Цена</th>
                        <th>Ночей</th>
                        <th>Дата вылета</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    {{foreach var tour in Tours}}
                    <tr>
                        <td>{{tour.Id}}</td>
                        <td class="td--title">{{tour.Title}}</td>
                        <td>{{tour.Country}}</td>
                        <td>{{tour.Price}} &#8381;</td>
                        <td>{{tour.Nights}}</td>
                        <td>{{tour.DepartureDate}}</td>
                        <td class="td--actions">
                            <a href="/admin/edit/{{tour.Id}}" class="btn btn--small btn--edit">Редактировать</a>
                            <form method="POST" action="/admin/delete/{{tour.Id}}" class="inline-form"
                                  onsubmit="return confirm('Удалить тур &laquo;{{tour.Title}}&raquo;?');">
                                <button type="submit" class="btn btn--small btn--delete">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    {{endfor}}
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
