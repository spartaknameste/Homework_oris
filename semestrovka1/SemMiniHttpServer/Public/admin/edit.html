<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать тур — Админ-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar__logo">
            <span class="sidebar__logo-icon">&#9992;</span>
            <span class="sidebar__logo-text">TourAdmin</span>
        </div>
        <nav class="sidebar__nav">
            <a href="/admin" class="sidebar__link sidebar__link--active">
                <span class="sidebar__link-icon">&#128203;</span>
                Туры
            </a>
            <a href="/" class="sidebar__link" target="_blank">
                <span class="sidebar__link-icon">&#127760;</span>
                Открыть сайт
            </a>
        </nav>
    </aside>

    <main class="main">
        <header class="main__header">
            <h1 class="main__title">Редактировать тур #{{Tour.Id}}</h1>
            <a href="/admin" class="btn btn--secondary">&larr; Назад к списку</a>
        </header>

        <form method="POST" action="/admin/edit/{{Tour.Id}}" class="form" id="tourForm">
            <div class="form__grid">
                <div class="form__group">
                    <label class="form__label" for="title">Название тура *</label>
                    <input type="text" id="title" name="title" class="form__input" required
                           value="{{Tour.Title}}">
                </div>

                <div class="form__group">
                    <label class="form__label" for="country">Страна *</label>
                    <input type="text" id="country" name="country" class="form__input" required
                           value="{{Tour.Country}}">
                </div>

                <div class="form__group">
                    <label class="form__label" for="location">Локация *</label>
                    <input type="text" id="location" name="location" class="form__input" required
                           value="{{Tour.Location}}">
                </div>

                <div class="form__group">
                    <label class="form__label" for="price">Цена (&#8381;) *</label>
                    <input type="text" id="price" name="price" class="form__input" required
                           value="{{Tour.Price}}">
                    <span class="form__error" id="price-error"></span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="nights">Ночей *</label>
                    <input type="text" id="nights" name="nights" class="form__input" required
                           value="{{Tour.Nights}}">
                    <span class="form__error" id="nights-error"></span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="departure_date">Дата вылета *</label>
                    <input type="text" id="departure_date" name="departure_date" class="form__input" required
                           value="{{Tour.DepartureDate}}" placeholder="дд.мм.гггг">
                    <span class="form__error" id="date-error"></span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="rating">Рейтинг (1-5)</label>
                    <input type="text" id="rating" name="rating" class="form__input"
                           value="{{Tour.Rating}}">
                    <span class="form__error" id="rating-error"></span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="image_url">URL изображения</label>
                    <input type="text" id="image_url" name="image_url" class="form__input"
                           value="{{Tour.ImageUrl}}">
                </div>
            </div>

            <div class="form__group form__group--full">
                <label class="form__label">Описание тура</label>
                <div id="editor"></div>
                <input type="hidden" name="description" id="description">
            </div>

            <div class="form__actions">
                <button type="submit" class="btn btn--primary btn--lg">Сохранить изменения</button>
                <a href="/admin" class="btn btn--secondary btn--lg">Отмена</a>
            </div>
        </form>
    </main>

    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script>
        var quill = new Quill('#editor', {
            theme: 'snow',
            placeholder: 'Введите описание тура...',
            modules: {
                toolbar: [
                    [{ 'header': [2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link'],
                    ['clean']
                ]
            }
        });

        var existingDescription = decodeURIComponent("{{Tour.Description}}".replace(/\+/g, ' '));
        if (existingDescription && existingDescription !== '') {
            quill.root.innerHTML = existingDescription;
        }

        var dateInput = document.getElementById('departure_date');
        var val = dateInput.value;
        if (val && val.indexOf('-') !== -1) {
            var parts = val.split('-');
            dateInput.value = parts[2] + '.' + parts[1] + '.' + parts[0];
        }

        function isInteger(str) {
            return /^\d+$/.test(str.trim());
        }

        function isValidDate(str) {
            var parts = str.split('.');
            if (parts.length !== 3) return false;
            var day = parseInt(parts[0], 10);
            var month = parseInt(parts[1], 10);
            var year = parseInt(parts[2], 10);
            if (isNaN(day) || isNaN(month) || isNaN(year)) return false;
            if (year < 2000 || year > 2100) return false;
            if (month < 1 || month > 12) return false;
            var date = new Date(year, month - 1, day);
            return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
        }

        function clearErrors() {
            document.querySelectorAll('.form__error').forEach(function(el) { el.textContent = ''; });
        }

        document.getElementById('tourForm').addEventListener('submit', function(e) {
            clearErrors();
            var hasError = false;

            var description = document.getElementById('description');
            description.value = quill.root.innerHTML;

            var price = document.getElementById('price');
            if (!isInteger(price.value)) {
                document.getElementById('price-error').textContent = 'Можно вводить только целое число';
                price.focus();
                e.preventDefault();
                hasError = true;
            }

            var nights = document.getElementById('nights');
            if (!isInteger(nights.value)) {
                document.getElementById('nights-error').textContent = 'Можно вводить только целое число';
                if (!hasError) nights.focus();
                e.preventDefault();
                hasError = true;
            }

            var rating = document.getElementById('rating');
            if (!isInteger(rating.value) || parseInt(rating.value) < 1 || parseInt(rating.value) > 5) {
                document.getElementById('rating-error').textContent = 'Введите целое число от 1 до 5';
                if (!hasError) rating.focus();
                e.preventDefault();
                hasError = true;
            }

            if (!isValidDate(dateInput.value)) {
                document.getElementById('date-error').textContent = 'Неверный формат даты. Введите в формате дд.мм.гггг';
                if (!hasError) dateInput.focus();
                e.preventDefault();
                hasError = true;
            }
        });
    </script>
</body>
</html>
